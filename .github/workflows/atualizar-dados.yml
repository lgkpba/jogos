name: Atualizar dados da Steam

on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas
  workflow_dispatch:         # permite rodar manualmente
  push:
    paths:
      - "assets/jogos.json"
      - "scripts/atualizar-dados.mjs"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar dados na Steam
        run: node scripts/atualizar-dados.mjs

      - name: Commit se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dados.json
          git diff --staged --quiet || git commit -m "Atualiza dados da Steam"
          git push